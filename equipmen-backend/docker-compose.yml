# MySQL 8.0 for the Balons Store register.
# Only needed if you are not running a local MySQL server already.
services:
  mysql:
    image: mysql:8.0
    container_name: balons-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ballons_store
    ports:
      - "3306:3306"
    volumes:
      - balons-mysql-data:/var/lib/mysql

volumes:
  balons-mysql-data:
